[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "det-rep"
version = "0.1.0"
description = "Matched hallucination detection and correction experiment core"
requires-python = ">=3.12,<3.13"
dependencies = [
  "kg-gen==0.4.0",
  "dspy==3.2.1",
  "litellm==1.91.1",
  "sentence-transformers==5.6.0",
  "numpy==2.5.1",
  "tenacity==9.1.4",
  "jsonschema==4.26.0",
  "PyYAML==6.0.3",
  "httpx==0.28.1",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]
gateway = [
  "fastapi>=0.115,<1",
  "google-cloud-secret-manager>=2.20,<3",
  "google-genai>=1,<2",
  "uvicorn[standard]>=0.30,<1",
]

[tool.setuptools.packages.find]
include = ["det_rep*", "gemini_gateway*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
